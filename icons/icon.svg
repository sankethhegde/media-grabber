<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="mg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset="0.5" stop-color="#db2777"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <radialGradient id="mg-glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mg-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mg-ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffe3f0"/>
    </linearGradient>
    <filter id="mg-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#3b0764" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- badge -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#mg-bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#mg-glow)"/>
  <path d="M4 36 C4 18 18 4 36 4 H92 C110 4 124 18 124 36 V50 C88 64 40 64 4 50 Z" fill="url(#mg-gloss)"/>
  <rect x="5" y="5" width="118" height="118" rx="31" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>

  <!-- arrow dropping into a tray -->
  <g filter="url(#mg-shadow)" fill="none" stroke="url(#mg-ink)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M64 26 V78" stroke-width="15"/>
    <path d="M41 57 L64 80 L87 57" stroke-width="15"/>
    <path d="M31 84 V94 C31 100 35 104 41 104 H87 C93 104 97 100 97 94 V84" stroke-width="11"/>
  </g>

  <!-- sparkles -->
  <path d="M101 17 Q103 27 113 29 Q103 31 101 41 Q99 31 89 29 Q99 27 101 17 Z" fill="#ffffff" opacity="0.95"/>
  <path d="M24 30 Q25 35 30 36 Q25 37 24 42 Q23 37 18 36 Q23 35 24 30 Z" fill="#ffffff" opacity="0.75"/>
</svg>
